<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in – Blabilingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bona+Nova:ital,wght@0,400;0,700;1,400&family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 4'%3E%3Cpath fill='%23C1121F' d='M0 0h2v2H0z'/%3E%3Cpath fill='%231D5FBF' d='M2 0h2v2H2z'/%3E%3Cpath fill='%23FFD23F' d='M0 2h2v2H0z'/%3E%3Cpath fill='%231B7A43' d='M2 2h2v2H2z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="core/styles.css">
</head>
<body>
<header class="masthead">
  <div class="masthead-bar"><nav class="languages" aria-label="Site"><a href="./">← Blabilingo</a></nav></div>
  <h1>Sign in</h1>
  <p class="lede">Sign in to keep your progress on every device. The first time you sign in with Google, your Blabilingo account is created.</p>
</header>
<main>
  <section id="signin" class="account-card" aria-live="polite">
    <p class="account-note">Loading…</p>
  </section>
</main>
<script>
  // Sign-in needs the site served over http: modules and Google's popup do not work from file://
  if (location.protocol === 'file:') document.getElementById('signin').innerHTML =
    '<p class="account-note">Signing in needs the site served over http. Run <code>./serve-for-phone.sh</code> and open <code>http://localhost:8000/signin.html</code>.</p>';
</script>
<script type="module">
  import { currentUser, signInWithGoogle, ensureProfile } from './core/cloud.js';

  const box = document.getElementById('signin');
  // Only return to a page on this site
  const nextParam = new URLSearchParams(location.search).get('next');
  const next = nextParam && nextParam.startsWith('/') && !nextParam.startsWith('//') ? nextParam : 'account.html';
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

  function showSignIn(error) {
    box.innerHTML = `
      <button type="button" class="google-btn" id="google">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span>Continue with Google</span>
      </button>
      ${error ? `<p class="account-error">${esc(error)}</p>` : ''}
      <p class="account-note">Practising without an account still works: progress is then kept in this browser only.</p>`;
    box.querySelector('#google').addEventListener('click', async e => {
      e.currentTarget.disabled = true;
      try {
        await signInWithGoogle();
        location.replace(next);
      } catch (err) {
        const closed = err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request';
        showSignIn(closed ? '' : err.code === 'auth/popup-blocked'
          ? 'Your browser blocked the Google window. Allow pop-ups for this site and try again.'
          : `Signing in did not work (${err.code || err.message}).`);
      }
    });
  }

  const user = await currentUser();
  if (user) {
    const profile = await ensureProfile(user).catch(() => ({}));
    box.innerHTML = `<p>You are signed in as <b>${esc(profile.displayName || user.displayName || user.email)}</b>.</p>
      <p class="account-links"><a class="btn primary" href="account.html">Your account</a> <a class="btn" href="./">Practise</a></p>`;
  } else showSignIn();
</script>
</body>
</html>
