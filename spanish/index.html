<header class="masthead">

  </div>
</nav>

<main>
  <aside id="forgotten" class="forgotten" aria-labelledby="forgotten-title" hidden></aside>
  <section id="view-table" hidden></section>
  <section id="view-quiz" hidden></section>

<div id="tip" class="tip" role="tooltip" hidden></div>
